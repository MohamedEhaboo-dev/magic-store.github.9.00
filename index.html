<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>MAGIC STORE - PS4 EXPLOIT PORTAL</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-glow: rgba(0, 210, 255, 0.6);
            --bg-dark: rgba(4, 8, 15, 0.75);
            --text-color: #ffffff;
        }

        body {
            background: url('PsFree/IMG_0800.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            z-index: -1;
        }

        header {
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-glow);
            letter-spacing: 3px;
            margin: 0;
        }

        p.subtitle {
            color: #cbd5e0;
            font-size: 1rem;
            margin-top: 5px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 450px;
            margin: 20px 0;
        }

        .btn {
            background: rgba(8, 14, 24, 0.85);
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover, .btn:focus {
            background: var(--neon-blue);
            color: #04080f;
            box-shadow: 0 0 25px var(--neon-blue);
            transform: scale(1.02);
        }

        footer {
            font-size: 0.85rem;
            color: #a0aec0;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MAGIC STORE</h1>
        <p class="subtitle">اختر إصدار السوفت وير الخاص بجهازك</p>
    </header>

    <div class="container">
        <!-- زرار سوفت 9.00 -->
        <a href="PsFree/index.html" class="btn">PS4 Firmware 9.00 (PSFree)</a>

        <!-- زرار السوفتات الشاملة (5.05 - 13.52) -->
        <a href="https://sw4ps4-ps.github.io/ar" class="btn">PS4 Firmware (5.05 - 13.52)</a>
    </div>

    <footer>
        <p>MAGIC STORE &copy; - Portal</p>
    </footer>

</body>
</html>
